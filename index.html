<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verewige dich</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 2rem; }
        .container { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h1 { text-align: center; color: #333; }
        form { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem; }
        input, textarea { padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 0.75rem; background-color: #007bff; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .entry { background: #e9ecef; padding: 1rem; border-radius: 4px; margin-bottom: 1rem; }
        .entry h3 { margin: 0 0 0.5rem 0; color: #007bff; }
        .entry p { margin: 0; color: #555; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Verewige dich hier!</h1>
        <form id="guestbookForm">
            <input type="text" id="name" placeholder="Dein Name" required>
            <textarea id="message" placeholder="Deine Nachricht" rows="4" required></textarea>
            <button type="submit">Abschicken</button>
        </form>
        <div id="entries">
            <h2>Einträge:</h2>
            <div class="entry">
                <h3>Beispiel</h3>
                <p>Das ist eine Beispielnachricht.</p>
            </div>
        </div>
    </div>
    <script>
        const form = document.getElementById('guestbookForm');
        const entries = document.getElementById('entries');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const message = document.getElementById('message').value;

            const newEntry = document.createElement('div');
            newEntry.classList.add('entry');
            newEntry.innerHTML = `<h3>${name}</h3><p>${message}</p>`;
            entries.prepend(newEntry);

            form.reset();
        });
    </script>
</body>
</html>
